name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: '3.1'
            rails: '~> 6.1.0'
          - ruby: '3.1'
            rails: '~> 7.0.0'
          - ruby: '3.2'
            rails: '~> 7.1.0'
          - ruby: '3.3'
            rails: '~> 7.2.0'
          - ruby: '3.3'
            rails: '~> 8.0.0'
          - ruby: '3.4'
            rails: '~> 8.1.0'
          - ruby: '4.0'
            rails: '~> 8.1.0'
    name: Ruby ${{ matrix.ruby }} / Rails ${{ matrix.rails }}
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: '2.6.9'
          bundler-cache: true
          cache-version: ${{ matrix.rails }}
      - run: bundle exec rspec

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler: '2.6.9'
          bundler-cache: true
      - run: bundle exec rubocop
